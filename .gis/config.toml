concurrency = 3
base = "main"
verify = "npm test && npm run lint"
kinds = ["claude", "codex"]
review = false
verify_max = 5
review_max = 3
blocked_timeout = "15m"
claude_permission_mode = "auto"

[[profiles.plan]]
kind = "claude"
model = "opus"
effort = "medium"

[[profiles.plan]]
kind = "codex"
model = "gpt-5.6-sol"
effort = "high"

[[profiles.implement]]
kind = "codex"
model = "gpt-5.6-luna"
effort = "xhigh"

[[profiles.implement]]
kind = "claude"
model = "opus"
effort = "xhigh"

[[profiles.review]]
kind = "claude"
model = "opus"
effort = "xhigh"

[[profiles.review]]
kind = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"
