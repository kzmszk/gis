concurrency = 3
base = "main"
verify = "pnpm check"
kinds = ["claude", "codex"]
review = true
verify_max = 5
review_max = 3
blocked_timeout = "15m"
worker_timeout = "1h"
verify_timeout = "15m"
claude_permission_mode = "auto"

[[profiles.plan]]
kind = "claude"
model = "opus"
effort = "medium"

[[profiles.plan]]
kind = "codex"
model = "gpt-5.6-sol"
effort = "high"

[[profiles.implement]]
kind = "codex"
model = "gpt-5.6-luna"
effort = "xhigh"

[[profiles.implement]]
kind = "claude"
model = "opus"
effort = "xhigh"

# Reviewer selection prefers a kind different from the implementation worker.
# If unavailable, it tries the same-kind entries below, then the implementation
# candidate itself. Codex Sol is the upper-model fallback for Codex Luna;
# Claude Opus falls back to the same model because no higher Claude is configured.
[[profiles.review]]
kind = "claude"
model = "opus"
effort = "xhigh"

[[profiles.review]]
kind = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"
